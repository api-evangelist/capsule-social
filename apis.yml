aid: capsule-social
name: Capsule Social
description: >-
  Capsule Social was a decentralized-innovation company founded in early 2021 by
  cryptography researcher Nadim Kobeissi to build tools for a web3 future. Its
  flagship product, Blogchain, was a decentralized publishing and social platform
  — a Substack-like blogging experience with Twitter-like social elements — built
  on IPFS for serverless content storage and the NEAR Protocol for identity,
  digital-asset management, and tokenized community governance, letting creators
  own their content and monetize it behind optional paywalls. The company raised a
  ~$2.6M seed round from investors including Polychain, Naval Ravikant, Fyrfly, and
  former Coinbase CTO Balaji Srinivasan. The Blogchain product and the capsulesocial
  GitHub organization have been inactive since roughly October 2023, and the
  capsule.social domain has since been re-registered by an unrelated "social memory"
  consumer app — so the surviving authoritative surface for this entity is its
  open-source GitHub org, not the current website. There is no hosted REST API:
  Blogchain is a client-side web3 dApp (Vue frontend, NEAR smart contracts, IPFS).
